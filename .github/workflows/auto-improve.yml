name: Auto improve (scheduled)

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print the plan, write nothing"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: auto-improve
  cancel-in-progress: false

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run maintainer automation
        env:
          # AUTOMATION_TOKEN is a PAT that can write to the other repos in
          # automation/config.json. Without it we fall back to this repo's token,
          # so single-repo use needs no extra setup.
          AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AUTOMATION_MODEL: ${{ vars.AUTOMATION_MODEL }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node automation/auto-improve.mjs
