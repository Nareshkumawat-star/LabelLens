# Render Blueprint for LabelLens (Next.js App Router)
#
# Deploy: Render Dashboard -> New + -> Blueprint -> pick this repo.
# Render reads this file, then asks you to fill in the two secret values
# (`sync: false`) because they cannot be committed to git.
#
# Values you will be prompted for:
#   GEMINI_API_KEY   Google AI Studio key  (https://aistudio.google.com/apikey)
#   MONGODB_URI      MongoDB Atlas connection string (include /labellens)

services:
  - type: web
    name: labellens
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # sync: false -> Render prompts for the value at deploy time and stores it
      # as a secret on the service. Never put real keys in this file.
      - key: GEMINI_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: GEMMA_MODEL
        value: gemini-2.5-flash
